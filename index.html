<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Database Undangan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX Library untuk Export Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-envelope-open-text me-2"></i>Dashboard Database Undangan</span>
            <button class="btn btn-outline-light btn-sm" onclick="loadData()"><i class="fa-solid fa-rotate me-1"></i> Refresh Data</button>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Alert Status -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <!-- Navigasi Sheet & Fitur Utama -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-7 mb-2 mb-md-0">
                        <ul class="nav nav-pills" id="sheetTabs">
                            <!-- Dynamic Tabs Generated via JS -->
                        </ul>
                    </div>
                    <div class="col-md-5 text-md-end">
                        <button class="btn btn-success btn-sm me-1 mb-1" onclick="exportToExcel()"><i class="fa-solid fa-file-excel me-1"></i> Export Excel</button>
                        <button class="btn btn-warning btn-sm me-1 mb-1" onclick="showDuplicateModal()"><i class="fa-solid fa-copy me-1"></i> Data Double</button>
                        <button class="btn btn-primary btn-sm mb-1" onclick="openAddModal()"><i class="fa-solid fa-plus me-1"></i> Tambah Data</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel Konten Utama -->
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <div class="row align-items-center">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <h5 class="mb-0 text-primary" id="currentTitle">Memuat Data...</h5>
                    </div>
                    <div class="col-md-6">
                        <!-- Pencarian Gabungan Nama & Alamat -->
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-search text-muted"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Cari berdasarkan Nama atau Alamat..." onkeyup="filterTable()">
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0 align-middle" id="mainTable">
                        <thead class="table-dark" id="tableHead"></thead>
                        <tbody id="tableBody">
                            <tr><td colspan="100" class="text-center py-4">Mengambil data dari Spreadsheet...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Tambah/Edit Data -->
    <div class="modal fade" id="dataModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Data Undangan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="dataForm">
                        <input type="hidden" id="editRowIndex">
                        <div id="formFieldsContainer" class="row g-3">
                            <!-- Dynamic Form Fields -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="saveData()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Data Double -->
    <div class="modal fade" id="duplicateModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>Deteksi Data Double</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted">Berikut adalah daftar nama yang terdeteksi ganda (kemungkinan nama sama di seluruh sheet):</p>
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm" id="duplicateTable">
                            <thead class="table-warning">
                                <tr>
                                    <th>Sheet / Kloter</th>
                                    <th>Nama</th>
                                    <th>Alamat</th>
                                    <th>Detail Lainnya</th>
                                </tr>
                            </thead>
                            <tbody id="duplicateBody">
                                <tr><td colspan="4" class="text-center">Memindai data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // URL Web App Google Apps Script Anda yang sudah terintegrasi
        const API_URL = "https://script.google.com/macros/s/AKfycbyiEzqeKVgYoRV0XpyCut_YljmS6d3v6Ii08M6nSVviRu_Ayzzsz227kqLF8BnAWodr/exec";
        
        let globalData = {};
        let activeSheet = "";

        window.onload = function() {
            loadData();
        };

        function showAlert(message, type = 'success') {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type}`;
            box.innerText = message;
            box.classList.remove('d-none');
            setTimeout(() => box.classList.add('d-none'), 4000);
        }

        async function loadData() {
            try {
                let res = await fetch(API_URL);
                globalData = await res.json();
                let sheetNames = Object.keys(globalData);
                if (sheetNames.length > 0) {
                    if (!activeSheet || !globalData[activeSheet]) {
                        activeSheet = sheetNames[0];
                    }
                    renderTabs(sheetNames);
                    renderTable(activeSheet);
                }
            } catch (err) {
                showAlert("Gagal memuat data: " + err, "danger");
            }
        }

        function renderTabs(sheetNames) {
            let tabsHtml = "";
            sheetNames.forEach(name => {
                let active = (name === activeSheet) ? "active" : "";
                tabsHtml += `<li class="nav-item me-1 mb-1">
                    <button class="nav-link ${active}" onclick="switchSheet('${name}')">${name}</button>
                </li>`;
            });
            document.getElementById('sheetTabs').innerHTML = tabsHtml;
        }

        function switchSheet(name) {
            activeSheet = name;
            renderTabs(Object.keys(globalData));
            renderTable(name);
            document.getElementById('searchInput').value = "";
        }

        function renderTable(sheetName) {
            document.getElementById('currentTitle').innerText = `Data Kloter / Sheet: ${sheetName}`;
            let sheetData = globalData[sheetName];
            if (!sheetData || sheetData.rows.length === 0) {
                document.getElementById('tableHead').innerHTML = "";
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="100" class="text-center py-4 text-muted">Tidak ada data di sheet ini.</td></tr>`;
                return;
            }

            let headers = sheetData.headers;
            let headHtml = "<tr><th>#</th>";
            headers.forEach(h => headHtml += `<th>${h}</th>`);
            headHtml += "<th>Aksi</th></tr>";
            document.getElementById('tableHead').innerHTML = headHtml;

            let bodyHtml = "";
            sheetData.rows.forEach((row, idx) => {
                bodyHtml += `<tr data-search="${Object.values(row).join(' ').toLowerCase()}">`;
                bodyHtml += `<td>${idx + 1}</td>`;
                headers.forEach(h => {
                    let val = row[h] !== undefined ? row[h] : "";
                    if (h.toLowerCase().includes('packing')) {
                        let badgeColor = val.toString().toLowerCase() === 'sudah' ? 'success' : 'secondary';
                        bodyHtml += `<td><span class="badge bg-${badgeColor}">${val || 'Belum'}</span></td>`;
                    } else {
                        bodyHtml += `<td>${val}</td>`;
                    }
                });
                bodyHtml += `<td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${row.rowIndex})"><i class="fa-solid fa-pen"></i></button>
                </td>`;
                bodyHtml += `</tr>`;
            });
            document.getElementById('tableBody').innerHTML = bodyHtml;
        }

        function filterTable() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                let searchText = row.getAttribute('data-search');
                if (searchText && searchText.includes(query)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }

        // Fungsi Export Data ke Excel (.xlsx)
        function exportToExcel() {
            let sheetData = globalData[activeSheet];
            if (!sheetData || !sheetData.rows || sheetData.rows.length === 0) {
                showAlert("Tidak ada data di kloter ini untuk diexport!", "warning");
                return;
            }

            // Bersihkan properti internal rowIndex sebelum diexport ke Excel
            let exportRows = sheetData.rows.map(r => {
                let cleanRow = {...r};
                delete cleanRow.rowIndex;
                return cleanRow;
            });

            let worksheet = XLSX.utils.json_to_sheet(exportRows);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, activeSheet);

            // Simpan file dengan nama sesuai kloter aktif
            let fileName = `Data_Undangan_${activeSheet}.xlsx`;
            XLSX.writeFile(workbook, fileName);
            showAlert(`Berhasil mengunduh file ${fileName}`, "success");
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Tambah Data Undangan";
            document.getElementById('editRowIndex').value = "";
            let sheetData = globalData[activeSheet];
            let headers = sheetData ? sheetData.headers : [];
            
            let html = "";
            headers.forEach(h => {
                html += `<div class="col-md-6">
                    <label class="form-label fw-bold">${h}</label>
                    <input type="text" class="form-control" name="${h}" required>
                </div>`;
            });
            document.getElementById('formFieldsContainer').innerHTML = html;
            new bootstrap.Modal(document.getElementById('dataModal')).show();
        }

        function openEditModal(rowIndex) {
            document.getElementById('modalTitle').innerText = "Edit Data Undangan & Packing / PJ";
            document.getElementById('editRowIndex').value = rowIndex;
            let sheetData = globalData[activeSheet];
            let rowData = sheetData.rows.find(r => r.rowIndex === rowIndex);
            let headers = sheetData.headers;
            
            let html = "";
            headers.forEach(h => {
                let val = rowData[h] !== undefined ? rowData[h] : "";
                html += `<div class="col-md-6">
                    <label class="form-label fw-bold">${h}</label>
                    <input type="text" class="form-control" name="${h}" value="${val}">
                </div>`;
            });
            document.getElementById('formFieldsContainer').innerHTML = html;
            new bootstrap.Modal(document.getElementById('dataModal')).show();
        }

        async function saveData() {
            let rowIndex = document.getElementById('editRowIndex').value;
            let action = rowIndex ? "update" : "add";
            let formElements = document.querySelectorAll('#formFieldsContainer input');
            let dataObj = {};
            formElements.forEach(input => {
                dataObj[input.name] = input.value;
            });

            let payload = {
                action: action,
                sheetName: activeSheet,
                rowIndex: rowIndex ? parseInt(rowIndex) : null,
                data: dataObj
            };

            showAlert("Menyimpan data ke Spreadsheet...", "info");
            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                let result = await res.json();
                if (result.status === 'success') {
                    showAlert(result.message, "success");
                    bootstrap.Modal.getInstance(document.getElementById('dataModal')).hide();
                    loadData();
                } else {
                    showAlert("Gagal: " + result.message, "danger");
                }
            } catch (err) {
                showAlert("Terjadi kesalahan: " + err, "danger");
            }
        }

        function showDuplicateModal() {
            let nameCounts = {};
            let duplicates = [];

            Object.keys(globalData).forEach(sheetName => {
                globalData[sheetName].rows.forEach(row => {
                    let nameKey = Object.keys(row).find(k => k.toLowerCase().includes('nama'));
                    let addressKey = Object.keys(row).find(k => k.toLowerCase().includes('alamat'));
                    if (nameKey && row[nameKey]) {
                        let nameVal = row[nameKey].toString().trim().toLowerCase();
                        if (!nameCounts[nameVal]) {
                            nameCounts[nameVal] = [];
                        }
                        nameCounts[nameVal].push({
                            sheet: sheetName,
                            name: row[nameKey],
                            address: addressKey ? row[addressKey] : '-'
                        });
                    }
                });
            });

            Object.keys(nameCounts).forEach(name => {
                if (nameCounts[name].length > 1) {
                    nameCounts[name].forEach(item => duplicates.push(item));
                }
            });

            let dupBody = "";
            if (duplicates.length === 0) {
                dupBody = `<tr><td colspan="4" class="text-center text-success py-3">Tidak ada data ganda yang ditemukan!</td></tr>`;
            } else {
                duplicates.forEach(d => {
                    dupBody += `<tr>
                        <td><span class="badge bg-secondary">${d.sheet}</span></td>
                        <td>${d.name}</td>
                        <td>${d.address}</td>
                        <td>Terdeteksi kemiripan nama ganda</td>
                    </tr>`;
                });
            }
            document.getElementById('duplicateBody').innerHTML = dupBody;
            new bootstrap.Modal(document.getElementById('duplicateModal')).show();
        }
    </script>
</body>
</html>
